description = "Fine-tune InstructPix2Pix with LoRA for Indonesian traditional house image editing."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "diffusers",
    "transformers<5",
    "accelerate",
    "peft",
    "datasets",
    "pillow",
    "matplotlib",
    "pandas",
    "tqdm",
    "safetensors",
    "protobuf",
    "sentencepiece",
    "huggingface_hub",
    "ipykernel",
    "nbconvert",
    "pytorch-lightning",
    "google-genai",
]
